name: Build & Push Docker Image to Artifact Registry

on:
  push:
    branches: [main]

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v0.4.0'
        with:
          workload_identity_provider: 'projects/263386665758/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-ci@causal-galaxy-459115-v0.iam.gserviceaccount.com'

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v1

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west4-docker.pkg.dev

      - name: Build and Push Docker image
        run: |
          IMAGE_URI="us-central1-docker.pkg.dev/causal-galaxy-459115-v0/hcl-repository/order-service:${{ github.sha }}"
          docker build --file ./order-service/Dockerfile -t "$IMAGE_URI" 
          docker push "$IMAGE_URI"
